services:
  app:
    restart: unless-stopped
    environment:
      TRUSTED_PROXIES: "*"

  nginx:
    restart: unless-stopped
    ports: !reset []
    networks:
      - frontend-network
      - proxy
    labels:
      - traefik.enable=true

      # Gestão
      - traefik.http.routers.gestao.rule=Host(`gestao.espacodudaalmeida.com.br`)
      - traefik.http.routers.gestao.entrypoints=websecure
      - traefik.http.routers.gestao.tls=true
      - traefik.http.routers.gestao.tls.certresolver=cloudflare
      - traefik.http.routers.gestao.service=gestao

      # Landing pública
      - traefik.http.routers.landing.rule=Host(`espacodudaalmeida.com.br`) || Host(`www.espacodudaalmeida.com.br`)
      - traefik.http.routers.landing.entrypoints=websecure
      - traefik.http.routers.landing.tls=true
      - traefik.http.routers.landing.tls.certresolver=cloudflare
      - traefik.http.routers.landing.service=gestao

      # Serviço compartilhado
      - traefik.http.services.gestao.loadbalancer.server.port=80
      - traefik.docker.network=proxy

  node:
    ports: !reset []
    environment:
      NODE_ENV: production
      CHOKIDAR_USEPOLLING: "false"
    # NUNCA rodar "npm run build" aqui: scripts/deploy.sh (build_frontend_assets)
    # e a UNICA fonte do build de producao, execado explicitamente depois que
    # o container ja esta de pe. Duplicar o build aqui correria em paralelo
    # com esse exec (node nao tem healthcheck, entao "up --wait" nao espera
    # esse comando terminar), arriscando escrita concorrente em public/build.
    command: >
      sh -c "rm -f public/hot;
             [ -d node_modules/.bin ] || npm ci;
             tail -f /dev/null"

  postgres:
    ports: !reset []

  minio:
    ports: !reset []

  mailpit:
    profiles:
      - development

networks:
  proxy:
    external: true