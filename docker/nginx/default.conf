# Configuracao Nginx para a aplicacao Gestao de Clinicas (desenvolvimento).
# Encaminha PHP para o servico "app" (PHP-FPM na porta 9000) e serve /public.

server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    client_max_body_size 50M;

    # Compressao para respostas textuais.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Headers de seguranca minimos (baseline; CSP sera definido em fase futura).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nunca liste diretorios.
    autoindex off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Bloqueia acesso a .env e qualquer arquivo oculto (.git, .env, etc).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Impede execucao de PHP em pastas de upload/armazenamento publico.
    location ~* /storage/.*\.php$ {
        deny all;
    }
}
