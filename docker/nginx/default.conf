# Configuracao Nginx para a aplicacao Gestao de Clinicas.
# Encaminha PHP para o servico "app" (PHP-FPM na porta 9000)
# e publica apenas o diretorio /public da aplicacao.

server_tokens off;

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Permite uploads maiores, como documentos e anexos.
    client_max_body_size 50M;

    # =========================================================
    # COMPRESSAO
    # =========================================================

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;

    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # =========================================================
    # HEADERS DE SEGURANCA
    # =========================================================

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nao lista o conteudo de diretorios.
    autoindex off;

    # =========================================================
    # APLICACAO
    # =========================================================

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # robots.txt e sitemap.xml podem ser gerados dinamicamente
    # pela aplicacao.
    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$query_string;
    }

    location = /sitemap.xml {
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$query_string;
    }

    # =========================================================
    # PHP / PHP-FPM
    # =========================================================

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Informa ao Laravel que a requisicao original chegou via HTTPS
        # quando o TLS e finalizado pelo Traefik.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        fastcgi_hide_header X-Powered-By;

        # Tempo maximo para requisicoes PHP mais demoradas.
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;

        # Laravel pode gerar headers maiores por cookies,
        # sessao, autenticacao e redirects.
        # Evita:
        # "upstream sent too big header while reading response header"
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
    }

    # =========================================================
    # SEGURANCA DE ARQUIVOS
    # =========================================================

    # Bloqueia .env, .git e outros arquivos ocultos.
    # Permite apenas .well-known, caso seja necessario futuramente.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Nunca executar PHP dentro de storage publico.
    location ~* ^/storage/.*\.php$ {
        deny all;
    }

    # Bloqueia arquivos normalmente sensiveis do projeto caso,
    # por erro de configuracao, fiquem acessiveis.
    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|vite\.config\.(js|ts)|phpunit\.xml|artisan)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================
    # LIVEWIRE (painel Filament)
    # =========================================================

    # Livewire v4 serve seus endpoints dinamicos (script, updates via AJAX,
    # upload/preview de arquivo, modulos JS/CSS por componente) sob um
    # prefixo derivado da APP_KEY (ex.: /livewire-<hash>/livewire.min.js),
    # nunca como arquivo fisico em /public. Precisa vir antes da regra
    # generica de assets estaticos abaixo: sem isso, aquele regex intercepta
    # /livewire-<hash>/livewire.min.js (extensao .js) e responde 404 antes
    # do Laravel/Livewire processar a rota dinamica.
    location ~ ^/livewire-[a-f0-9]+/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # =========================================================
    # ASSETS ESTATICOS
    # =========================================================

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;

        expires 7d;
        access_log off;

        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }
}