; Configuracao PHP para desenvolvimento do projeto Gestao de Clinicas.

memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 55M
max_execution_time = 120
max_input_time = 120

date.timezone = UTC

display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL

; As extensoes redis e imagick sao habilitadas pelo proprio Dockerfile
; (docker-php-ext-enable), que gera seus arquivos .ini proprios em conf.d.

session.save_handler = files
