# Ambiente de desenvolvimento do projeto Gestao de Clinicas.
#
# Nao usa Laravel Sail. Configuracao explicita e documentada em docs/architecture/docker.md.
# Todas as portas publicadas sao vinculadas a 127.0.0.1 (nunca 0.0.0.0) e nenhum
# segredo esta hardcoded aqui - tudo vem do .env (nunca versionado).
#
# Redes:
#   frontend-network: nginx, node, app (acesso normal, com saida para internet -
#     necessario para o app consultar APIs externas como o ViaCEP, e para o
#     node baixar fontes via Vite).
#   data-network: app, queue, scheduler, postgres, redis, minio, minio-init,
#     mailpit. Separada da frontend-network (nginx/node nao enxergam banco/
#     cache/storage diretamente). NAO marcada "internal: true": testado e
#     confirmado que, neste Docker Desktop, uma rede "internal" impede a
#     publicacao das portas de host (127.0.0.1:5433/9000/9001/8025) dos
#     containers que estao *somente* nela (postgres/minio/mailpit) - quebrando
#     o acesso local a essas ferramentas, que e um requisito explicito desta
#     fundacao. A regra que pediu essa rede tambem previa essa ressalva
#     ("internal quando isso nao impedir o funcionamento necessario"). A
#     segmentacao de rede (nginx/node nunca alcancam banco/cache/storage) e o
#     binding exclusivo em 127.0.0.1 continuam garantindo o isolamento pedido.
#     O "app" participa das duas redes (fala com Postgres/Redis/MinIO/Mailpit
#     e tambem com APIs externas). "queue"/"scheduler" ficam somente na
#     data-network nesta fase (nao fazem chamadas externas ainda).

name: gestao-clinicas

x-php-image: &php-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: gestao-clinicas/php:local

services:
  app:
    <<: *php-image
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    networks:
      - frontend-network
      - data-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # So fica "healthy" quando o PHP-FPM responde E as dependencias
      # Composer ja foram instaladas (evita que queue/scheduler/node
      # iniciem contra um vendor/ inexistente em um clone limpo).
      test: ["CMD-SHELL", "[ -f /var/www/html/vendor/autoload.php ] && bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: gestao-clinicas/node:local
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
      # Somente leitura: o vendor e gerenciado exclusivamente pelo container
      # "app"/bootstrap. O node so precisa dele para o wayfinder:generate.
      - vendor:/var/www/html/vendor:ro
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    command: >
      sh -c "[ -d node_modules/.bin ] || npm ci &&
             npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    networks:
      - frontend-network
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gestao_clinicas}
      POSTGRES_USER: ${DB_USERNAME:-gestao_clinicas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-gestao_clinicas_test}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-database.sh:/docker-entrypoint-initdb.d/10-create-test-database.sh:ro
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-5433}:5432"
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gestao_clinicas} -d ${DB_DATABASE:-gestao_clinicas}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
      --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    volumes:
      - redis_data:/data
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $${REDIS_PASSWORD:?} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  queue:
    <<: *php-image
    restart: unless-stopped
    init: true
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    networks:
      - data-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command: >
      php artisan queue:work redis
      --sleep=1
      --tries=3
      --backoff=5
      --timeout=120
      --max-time=3600

  scheduler:
    <<: *php-image
    restart: unless-stopped
    init: true
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    networks:
      - data-network
    depends_on:
      app:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - data-network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
      AWS_BUCKET: ${AWS_BUCKET:-clinical-files}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$AWS_BUCKET" &&
        mc anonymous set none "local/$$AWS_BUCKET" &&
        echo "Bucket $$AWS_BUCKET pronto (privado)."
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.30.4
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - data-network

networks:
  frontend-network:
    driver: bridge
  data-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  node_modules:
  vendor:
