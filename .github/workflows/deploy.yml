name: Deploy

# So dispara depois que o workflow "CI" (ci.yml) terminar de rodar em main,
# e so segue para o deploy se ele tiver passado - nunca reexecuta a suite de
# testes aqui, so encadeia depois que ela realmente passou.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Nunca dois deploys ao mesmo tempo na mesma VPS - a segunda execucao fica
# na fila em vez de cancelar a primeira no meio.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Ambiente "production" do GitHub: permite exigir aprovação manual e/ou
    # secrets com escopo restrito a este job, configurado em
    # Settings -> Environments (ver docs/DEPLOYMENT.md).
    environment:
      name: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # SHA256 fingerprint da host key da VPS: pina o servidor esperado
          # em vez de aceitar qualquer host key na primeira conexão (o
          # equivalente inseguro de StrictHostKeyChecking=no). Ver
          # docs/DEPLOYMENT.md para o comando que gera esse valor.
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/apps/gestao-clinicas
            # "bash scripts/deploy.sh" em vez de "./scripts/deploy.sh": nao
            # depende do bit de execucao estar setado no checkout (pode se
            # perder em alguns clones/exports), so precisa do arquivo existir.
            bash scripts/deploy.sh
