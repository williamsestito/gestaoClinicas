name: Deploy

# So dispara depois que o workflow "CI" (ci.yml) terminar de rodar em main,
# e so segue para o deploy se ele tiver passado - nunca reexecuta a suite de
# testes aqui, so encadeia depois que ela realmente passou.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Nunca dois deploys ao mesmo tempo na mesma VPS - a segunda execucao fica
# na fila em vez de cancelar a primeira no meio.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Ambiente "production" do GitHub: permite exigir aprovação manual e/ou
    # secrets com escopo restrito a este job, configurado em
    # Settings -> Environments (ver docs/DEPLOYMENT.md).
    environment:
      name: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # SHA256 fingerprint da host key da VPS: pina o servidor esperado
          # em vez de aceitar qualquer host key na primeira conexão (o
          # equivalente inseguro de StrictHostKeyChecking=no). Ver
          # docs/DEPLOYMENT.md para o comando que gera esse valor.
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 15m
          script: |
            set -Eeuo pipefail
            cd /opt/apps/gestao-clinicas

            # Bootstrap minimo ANTES de chamar o script: no primeiro deploy
            # depois de scripts/deploy.sh ser adicionado (ou de qualquer
            # alteracao nele), o checkout da VPS ainda esta no commit
            # anterior e o arquivo pode nem existir ainda - "bash
            # scripts/deploy.sh" direto falharia com "No such file or
            # directory" antes mesmo de chegar ao update_repository() interno
            # do proprio script. scripts/deploy.sh tambem faz fetch/reset
            # (idempotente - roda de novo sem problema, e cobre quem o chama
            # direto sem passar por aqui, ex.: `make prod-deploy` manual).
            #
            # PREVIOUS_COMMIT precisa ser capturado ANTES do reset e
            # exportado para scripts/deploy.sh herdar: backup_current_commit()
            # so recaptura sozinho se a variavel ainda nao existir - se o
            # reset abaixo ja tivesse rodado antes dessa captura, o "commit
            # anterior" guardado seria o mesmo commit novo (o reset ja teria
            # movido o HEAD), e o rollback em caso de falha viraria um no-op.
            PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            export PREVIOUS_COMMIT

            git fetch origin main
            git reset --hard origin/main

            # Chamado como "bash scripts/deploy.sh" (nao "./scripts/deploy.sh"),
            # entao o bit de execucao do arquivo e irrelevante aqui - so
            # precisamos confirmar que ele existe apos o bootstrap acima, com
            # uma mensagem clara caso nao exista.
            if [ ! -f scripts/deploy.sh ]; then
              echo "ERRO: scripts/deploy.sh não encontrado após bootstrap do repositório." >&2
              exit 1
            fi

            bash scripts/deploy.sh
