name: CI

# Roda em PRs contra main (inclusive beta -> main) e em push direto em main
# (o merge do PR). workflow_dispatch permite disparo manual quando preciso
# revalidar sem um novo commit/PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gestao_clinicas_test
          POSTGRES_USER: gestao_clinicas
          POSTGRES_PASSWORD: gestao_clinicas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestao_clinicas -d gestao_clinicas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, bcmath, intl, pcntl, posix, sockets, zip, exif, gd, opcache, redis, imagick
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Gerado ANTES do composer install: alguns hooks do post-autoload-dump
      # inicializam o Laravel e precisam de um .env valido.
      - name: Prepare .env.testing
        run: |
          cat > .env.testing <<'EOF'
          APP_NAME="Gestão de Clínicas"
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          APP_TIMEZONE=UTC
          APP_LOCALE=pt_BR
          APP_FALLBACK_LOCALE=pt_BR
          APP_MAINTENANCE_DRIVER=file
          BCRYPT_ROUNDS=4

          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_LEVEL=debug

          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=gestao_clinicas_test
          DB_USERNAME=gestao_clinicas
          DB_PASSWORD=gestao_clinicas_ci

          REDIS_CLIENT=phpredis
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          REDIS_PASSWORD=

          CACHE_STORE=redis
          SESSION_DRIVER=array
          QUEUE_CONNECTION=redis
          BROADCAST_CONNECTION=null

          MAIL_MAILER=array

          FILESYSTEM_DISK=local
          AWS_ACCESS_KEY_ID=
          AWS_SECRET_ACCESS_KEY=
          AWS_DEFAULT_REGION=us-east-1
          AWS_BUCKET=clinical-files
          AWS_ENDPOINT=http://127.0.0.1:9000
          AWS_USE_PATH_STYLE_ENDPOINT=true

          BUSINESS_DEFAULT_TIMEZONE=America/Sao_Paulo
          BUSINESS_DEFAULT_CURRENCY=BRL
          BUSINESS_DEFAULT_LOCALE=pt_BR

          SEED_PLATFORM_ADMIN=false
          EOF

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci --include=dev

      - name: Generate application key
        run: php artisan key:generate --env=testing --ansi

      - name: Build frontend assets
        run: npm run build

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U gestao_clinicas -d gestao_clinicas_test; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL não ficou pronto a tempo." >&2
          exit 1

      - name: Run test database migrations
        run: php artisan migrate --force --env=testing

      - name: Pint (verificação)
        run: ./vendor/bin/pint --test

      - name: Larastan / PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Pest
        run: php artisan test --env=testing

      - name: ESLint
        run: npm run lint

      - name: Prettier (verificação)
        run: npm run format:check

      - name: vue-tsc
        run: npm run types

      - name: Vitest
        run: npm run test:run